# This workflows generates downstream-ci workflows on every push.
# If you wish to skip the build, e.g. for testing manual changes add `[skip ci]` to commit msg.
name: Generate workflows

on: push

jobs:
  pre-commit:
    uses: ecmwf/reusable-workflows/.github/workflows/qa-precommit-run.yml@v2
    with:
      skip-hooks: "no-commit-to-branch"

  generate:
    if: github.actor != 'github-actions[bot]' && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.head_ref || github.ref  }}
        token: ${{ secrets.REBUILD_PUSH_TOKEN }}

    - name: Git config
      run: |
        git config --global user.email "github-actions@example.com"
        git config --global user.name "github-actions[bot]"

    - uses: actions/setup-python@v6
      with:
        python-version: "3.x"

    - name: Install dependencies
      run: |
        pip install pyyaml mypy types-PyYAML types-requests

    - name: Verify mypy
      run: |
        mypy .

    - name: Build
      env:
        SOURCE_REF: ${{ github.ref_name }}
      run: >
        python generate-workflows.py
        --config config.yml
        --ref "$SOURCE_REF"
        --dep-tree dependency_tree.yml
        --output .github/workflows
        downstream-ci
        downstream-ci-hpc

    - name: Check Git status
      id: git_status
      run: |
        GIT_STATUS_OUTPUT=$(git status --porcelain)
        if [[ -n "$GIT_STATUS_OUTPUT" ]]; then
          echo "GIT_STATUS_MODIFIED=true" >> $GITHUB_ENV
        else
          echo "GIT_STATUS_MODIFIED=false" >> $GITHUB_ENV
        fi

    - name: Commit & push index.js
        # Push only if the built workflow has changed.
      if: env.GIT_STATUS_MODIFIED == 'true'
      env:
        PUSH_REF: ${{ github.head_ref || github.ref  }}
      run: |
        git add .github/workflows/*
        git commit --no-verify -m "Build workflows"
        git push origin "$PUSH_REF"

  generate-private:
    if: >
      startsWith(github.ref, 'refs/heads/') &&
      github.actor != 'github-actions[bot]' &&
      !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    concurrency:
      group: private-downstream-ci-mirror-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
    - name: Checkout private-downstream-ci
      uses: actions/checkout@v7
      with:
        repository: ecmwf/private-downstream-ci
        ref: main
        token: ${{ secrets.REBUILD_PUSH_TOKEN }}
        path: private-downstream-ci

    - name: Checkout self
      uses: actions/checkout@v7
      with:
        ref: ${{ github.head_ref || github.ref  }}
        path: downstream-ci

    - name: Git config
      run: |
        git config --global user.email "github-actions@example.com"
        git config --global user.name "github-actions[bot]"

    - uses: actions/setup-python@v6
      with:
        python-version: "3.x"

    - name: Install dependencies
      run: |
        pip install pyyaml mypy types-PyYAML types-requests

    - name: Verify
      run: |
        mypy downstream-ci

    - name: Build
      env:
        SOURCE_REF: ${{ github.ref_name }}
      run: |
        python downstream-ci/generate-workflows.py \
          --config downstream-ci/config.yml \
          --ref "$SOURCE_REF" \
          --dep-tree downstream-ci/dependency_tree.yml \
          --output private-downstream-ci/.github/workflows \
          private-downstream-ci private-downstream-ci-hpc

        cd private-downstream-ci/.github/workflows

        if [ -f "private-downstream-ci.yml" ]; then
          mv -f private-downstream-ci.yml downstream-ci.yml
        fi

        if [ -f "private-downstream-ci-hpc.yml" ]; then
          mv -f private-downstream-ci-hpc.yml downstream-ci-hpc.yml
        fi

    - name: Check Git status
      id: git_status
      run: |
        cd private-downstream-ci
        GIT_STATUS_OUTPUT=$(git status --porcelain)
        if [[ -n "$GIT_STATUS_OUTPUT" ]]; then
          echo "GIT_STATUS_MODIFIED=true" >> $GITHUB_ENV
        else
          echo "GIT_STATUS_MODIFIED=false" >> $GITHUB_ENV
        fi

    - name: Commit & push
        # Push only if the built workflow has changed.
        # Deploy to private main only from main; feature branches deploy to a matching branch.
      if: env.GIT_STATUS_MODIFIED == 'true'
      env:
        SOURCE_REF: ${{ github.ref_name }}
      run: |
        rc=0
        git -C downstream-ci ls-remote --exit-code origin "refs/heads/$SOURCE_REF" >/dev/null || rc=$?
        if [[ "$rc" -eq 2 ]]; then
          echo "Source branch was deleted; skipping stale mirror push."
          exit 0
        elif [[ "$rc" -ne 0 ]]; then
          echo "Failed to query source branch state (git exit $rc)." >&2
          exit "$rc"
        fi
        cd private-downstream-ci
        git add .github/workflows/*
        git commit --no-verify -m "Build workflows"
        if [[ "$SOURCE_REF" == "main" ]]; then
          git push origin main
        else
          git push --force origin "HEAD:refs/heads/$SOURCE_REF"
        fi
